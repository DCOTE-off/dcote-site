name: Tests

on:
    push:
        branches: [main, production]
    pull_request:
    workflow_call:

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: dcote_testing
                    MYSQL_USER: sail
                    MYSQL_PASSWORD: password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            APP_ENV: testing
            APP_KEY: 'base64:5tIaWs6PF89DwcOwuDac6pXdNBntTc8LY3Neb2zNCBQ='
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: dcote_testing
            DB_USERNAME: sail
            DB_PASSWORD: password

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Build frontend
              run: |
                  npm ci
                  npm run build

            - name: Check code style
              run: ./vendor/bin/pint --test

            - name: Run tests
              run: php artisan test
